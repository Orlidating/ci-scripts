name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an upstream tag that moved after review is noticed without a push.
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: pnpm

      # The formatters are devDependencies so the SQL tests can actually run.
      # Without them they skip silently — which is how this suite went green
      # while two of its tests exercised nothing.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: node --test test/

      # Dogfood: this repo's own workflows must satisfy the check it ships,
      # including the reviewed lockfile (offline, as the pre-push hook runs it).
      - name: Action pins
        run: node bin/check-action-pins.mjs --require

      # Online (backend#421): every lockfile entry's tag is resolved in the upstream
      # repository itself, annotated tags dereferenced, and its commit must be the
      # locked SHA. An API error fails the job; it is never read as a pass.
      - name: Verify the lockfile against upstream tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/check-action-pins.mjs --verify-lock
